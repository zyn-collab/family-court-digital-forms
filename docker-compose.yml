# Family Court digital forms — the whole system on one host.
#   docker compose up -d
#   docker compose exec forms node user-cli.js add <username> "<Full name>" admin
# Site and admin: http://<host>:8080/   (admin: /admin.html)
# Settings: environment entries below, or a backend/.env file before building.
# For HTTPS, put the Court's TLS front (nginx, IIS, a load balancer) before port 8080;
# deploy/nginx.conf is a reference.
services:
  forms:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:4000"
    environment:
      FC_TRUST_PROXY: "1"
      # FC_PUBLIC_SITE: "https://forms.familycourt.gov.mv"
      # FC_SMS_WEBHOOK: ""
      # FC_EMAIL_WEBHOOK: ""
      # FC_EVENT_WEBHOOK: ""
      # FC_WEBHOOK_TOKEN: ""
    volumes:
      - fc-data:/data
    restart: unless-stopped

volumes:
  fc-data:
