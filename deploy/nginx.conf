# nginx: static site + API on one origin.
# Standalone use: replace `api:4000` with the host and port the backend listens on,
# add the TLS listener and set
# FC_ALLOW_ORIGIN to this server's public origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # attachments travel inside the submission body as data URIs: allow 10 MB files
    client_max_body_size 64m;

    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|svg|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
