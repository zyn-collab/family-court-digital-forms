# nginx in front of the backend, for HTTPS. The backend serves both the site and the API,
# so everything is passed through to it. Replace 127.0.0.1:4000 with the backend's address
# (in docker compose: the published port 8080), add the Court's certificate, and set
# FC_TRUST_PROXY=1 on the backend so it sees the visitor's address.
server {
    listen 80;
    server_name forms.familycourt.gov.mv;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name forms.familycourt.gov.mv;

    ssl_certificate     /etc/ssl/familycourt/fullchain.pem;
    ssl_certificate_key /etc/ssl/familycourt/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # attachments travel inside the submission as data URIs: room for several 10 MB files
    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
